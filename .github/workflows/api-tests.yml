name: API Test Suite

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman@6.2.2 newman-reporter-htmlextra

      # 151 requests: everything except (a) the 6 data-driven requests (run separately below,
      # each with its own fixture file), (b) the 9 originally-documented volume-sensitive
      # KNOWN DEFECT DEF-005/018/021 requests, and (c) 4 additional requests confirmed
      # volume-sensitive across 2 consecutive CI runs (Get current auth user - Invalid Token,
      # Refresh auth session - Missing refreshToken, Add a cart - Invalid Token,
      # Update Cart - No Token) -- all 13 run exclusively in known-defect-recheck.
      # Two further requests are documented gaps, not exclusions: "Get current auth user" and
      # "Refresh auth session" (the plain/self cases) each share their exact name with their
      # own parent folder, and that folder now has excluded children -- no --folder string can
      # select the plain case alone without also re-including an excluded sibling.
      - name: Run core regression (151 requests)
        env:
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          newman run "postman/collections/Project 2 - E-commerce API- DummyJSON.postman_collection.json" \
            -e "postman/environments/DummyJSON.postman_environment.json" \
            --env-var "auth_password_0pef=$AUTH_PASSWORD" \
            --folder "00 - Setup" \
            --folder "Login user and get tokens" \
            --folder "Wrong method" \
            --folder "Invalid refreshToken" \
            --folder "Invalid expiresInMins" \
            --folder "Products" \
            --folder "Get All Carts" \
            --folder "Get Single Cart" \
            --folder "Get Carts by User" \
            --folder "Add a cart - Valid Token" \
            --folder "Update Cart - Invalid Token" \
            --folder "Update Cart - Valid Token" \
            --folder "merge - true/" \
            --folder "merge - false/" \
            --folder "Negative/" \
            --folder "Delete Cart" \
            --folder "Get All Users" \
            --folder "Get Single User - Valid (Lower Boundary id=1)" \
            --folder "Get Single User - Valid (Upper Boundary id=208)" \
            --folder "Get Single User - Invalid Token" \
            --folder "Get Single User - Valid Token" \
            --folder "Negative - Invalid ID (0)" \
            --folder "Negative - Invalid ID (-1)" \
            --folder "Negative - Invalid ID (non-existent 9999)" \
            --folder "Negative - Invalid ID (non-numeric abc)" \
            --folder "Negative - Invalid ID (decimal 1.5)" \
            --folder "Search Users - Valid Query" \
            --folder "Search Users - No Match" \
            --folder "Search Users - Empty Query - Edge" \
            --folder "Search Users - Invalid Token" \
            --folder "Search Users - Valid Token" \
            --folder "Filter Users - Valid Key and Value" \
            --folder "Filter Users - Invalid Token" \
            --folder "Filter Users - Valid Token" \
            --folder "Negative - Invalid Key" \
            --folder "Negative - Missing Value" \
            --folder "Negative - Missing Key" \
            --folder "Get User Carts - Valid User With Carts" \
            --folder "Get User Carts - User ID Beyond Valid Range - Boundary" \
            --folder "Get User Carts - Invalid Token" \
            --folder "Get User Carts - Valid Token" \
            --folder "Negative - Invalid User ID" \
            --folder "Add User - Invalid Token" \
            --folder "Add User - Valid Token" \
            --folder "Update User - No Auth Token" \
            --folder "Update User - Invalid Token" \
            --folder "Update User - Valid Token" \
            --folder "Delete User - Valid ID" \
            --folder "Delete User - No Auth Token" \
            --folder "Delete User - Invalid Token" \
            --folder "Delete User - Valid Token" \
            --folder "Negative - Invalid ID" \
            --folder "Delete Same User Twice (Idempotency)" \
            --folder "GET after DELETE" \
            --folder "E2E Scenarios" \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/ci-run-report.html

      - name: "Data-driven: Add User - Happy Path"
        env:
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          newman run "postman/collections/Project 2 - E-commerce API- DummyJSON.postman_collection.json" \
            -e "postman/environments/DummyJSON.postman_environment.json" \
            --env-var "auth_password_0pef=$AUTH_PASSWORD" \
            --folder "Add User - Happy Path (Data-Driven)" \
            -d docs/add_user_happy.json \
            -r cli

      - name: "Data-driven: Add User - Negative Scenarios"
        env:
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          newman run "postman/collections/Project 2 - E-commerce API- DummyJSON.postman_collection.json" \
            -e "postman/environments/DummyJSON.postman_environment.json" \
            --env-var "auth_password_0pef=$AUTH_PASSWORD" \
            --folder "Add User - Negative Scenarios (Data-Driven)" \
            -d docs/add_user_negative.json \
            -r cli

      - name: "Data-driven: Update User - Happy Path"
        env:
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          newman run "postman/collections/Project 2 - E-commerce API- DummyJSON.postman_collection.json" \
            -e "postman/environments/DummyJSON.postman_environment.json" \
            --env-var "auth_password_0pef=$AUTH_PASSWORD" \
            --folder "Update User - Happy Path (Data-Driven)" \
            -d docs/update_user_happy.json \
            -r cli

      - name: "Data-driven: Update User - Negative Scenarios"
        env:
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          newman run "postman/collections/Project 2 - E-commerce API- DummyJSON.postman_collection.json" \
            -e "postman/environments/DummyJSON.postman_environment.json" \
            --env-var "auth_password_0pef=$AUTH_PASSWORD" \
            --folder "Update User - Negative Scenarios (Data-Driven)" \
            -d docs/update_user_negative.json \
            -r cli

      - name: "Data-driven: Add Cart - Happy Path"
        env:
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          newman run "postman/collections/Project 2 - E-commerce API- DummyJSON.postman_collection.json" \
            -e "postman/environments/DummyJSON.postman_environment.json" \
            --env-var "auth_password_0pef=$AUTH_PASSWORD" \
            --folder "Add a cart- Happy path" \
            -d docs/add_cart_happy.json \
            -r cli

      - name: "Data-driven: Add Cart - Negative, Edge, Boundary"
        env:
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          newman run "postman/collections/Project 2 - E-commerce API- DummyJSON.postman_collection.json" \
            -e "postman/environments/DummyJSON.postman_environment.json" \
            --env-var "auth_password_0pef=$AUTH_PASSWORD" \
            --folder "Add a cart - Negative, Edge, Boundary" \
            -d docs/add_cart_negative.json \
            -r cli

  known-defect-recheck:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman@6.2.2 newman-reporter-htmlextra

      - name: Recheck volume-sensitive auth defects in isolation
        env:
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          newman run "postman/collections/Project 2 - E-commerce API- DummyJSON.postman_collection.json" \
            -e "postman/environments/DummyJSON.postman_environment.json" \
            --env-var "auth_password_0pef=$AUTH_PASSWORD" \
            --folder "Get current auth user" \
            --folder "Refresh auth session" \
            --folder "Add a cart - No Token" \
            --folder "Add a cart - Invalid Token" \
            --folder "Update Cart - No Token" \
            --folder "Get Single User" \
            --folder "Search Users" \
            --folder "Filter Users" \
            --folder "Get User Carts" \
            --folder "Add User - No Auth Token" \
            --folder "Delete User" \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/ci-known-defect-report.html
